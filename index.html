<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="main.js"></script>
    <title>Atude - Modern Development</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #3a3a5c);
            color: #fff;
            line-height: 1.6;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            background-color: #2c2c3e;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            color: #fff;
        }

        .nav-buttons {
            display: flex;
            gap: 15px;
            position: relative; /* Ensure dropdown is positioned relative to the button */
        }

        .nav-buttons button {
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            color: #fff;
            background: #4a4a7d;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .nav-buttons button:hover {
            background: #6a6ab0;
        }

        .dropdown {
            /* Dropdown styles */
            position: absolute;
            top: 100%; /* Position below the button */
            left: 0%; /* Start at the center horizontally */
            transform: translateX(0%); /* Center the dropdown */
            display: none; /* Hidden by default */
            background: #4a4a7d;
            border-radius: 0px 0px 15px 15px; /* Make the dropdown more rounded */
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            padding: 0px 0px; /* Add padding inside the dropdown */
            min-width: 115px; /* Ensure the dropdown has a consistent width */
            text-align: center; /* Center the text inside the dropdown */
            opacity: 0.6;
            transition: all 0.9s ease; /* Smooth transition for dropdown appearance */
            z-index: 1000;
        }

        .dropdown a {
            display: block;
            padding: 10px 20px;
            font-size: 1rem;
            color: #fff;
            text-decoration: none;
            background: #4a4a7d;
            transition: background 0.3s ease;
        }

        .dropdown a:hover {
            background: #6a6ab0;
        }

        .nav-buttons button:hover + .dropdown,
        .dropdown:hover {
            display: block; /* Show dropdown on hover */
        }

        .hero {
            position: relative; /* Required for positioning the pseudo-element */
            text-align: center;
            padding: 10% 20px;
            min-height: calc(100vh - 140px); /* Adjust for header and footer height */
            display: flex;
            flex-direction: column;
            justify-content: center;
            background-image: url("https://despondean.ju.mp/assets/images/container11.jpg?v=d640a993");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 1; /* Ensure content is above the overlay */
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 30%;
            width: 40%;
            height: 100%;
            background: linear-gradient(to right, rgba(72, 77, 82, 0.5), transparent, rgba(72, 77, 82, 0.5)); /* Gradient on the sides */;
        /*    background: rgba(57, 61, 69, 0.5); /* Black with 50% transparency */
            z-index: -1; /* Place behind the content */
        }

        .hero::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 10%;
            background: linear-gradient(to bottom, rgba(72, 77, 82, 0.5), transparent, rgba(72, 77, 82, 0)); /* Gradient on the sides */;
            z-index: 0; /* Place behind the content */
        }

        .hero h1 {
            font-size: 3rem;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 1.2rem;
            margin-bottom: 30px;
        }

        .cta-button {
            display: block;
            margin: 0 auto;
            width: 200px;
            padding: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
            background: #4a4a7d;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s ease;
            text-align: center;
            
        }

        .cta-button:hover {
            background: #6a6ab0;
        }

        footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            text-align: center;
            padding: 20px;
            background-color: #2c2c3e;
        }

        footer p {
            font-size: 0.9rem;
            color: #aaa;
        }


        .dropdown:hover {
       /*     display: block;  Show dropdown on hover */
            opacity: 1; /* Fade in effect */

        }
        
        #PortfoliosDropdown a:nth-child(1) {
    /*        background: linear-gradient(135deg, #1fa9ff, #1a5aa2); /* Initial background */
            background: linear-gradient(135deg, #f61d1d, #7b1414);
            color: #fff; /* Initial text color */
            transition: background 0.5s ease, color 0.5s ease; /* Smooth transition for background and text color */
        }

        #PortfoliosDropdown a:nth-child(1):hover {
            background: #6e1111; /* Hover background */
            color: #f4b5b5; /* Hover text color */
        }


        #PortfoliosDropdown a:nth-child(2) {
            background: linear-gradient(135deg, #ffa127, #9e5b0f); /* Initial background */
            color: #fff; /* Initial text color */
            transition: background 0.5s ease, color 0.5s ease; /* Smooth transition for background and text color */
        }

        #PortfoliosDropdown a:nth-child(2):hover {
            background: #79460b; /* Hover background */
            color: #eed99b; /* Hover text color */
        }



        #PortfoliosDropdown a:nth-child(3) {
            background: linear-gradient(135deg, #3e8545, #245a16); /* Initial background */
            color: #fff; /* Initial text color */
            transition: background 0.5s ease, color 0.5s ease; /* Smooth transition for background and text color */
        }

        #PortfoliosDropdown a:nth-child(3):hover {
            background: #2e602f; /* Hover background */
            color: #aad6b3; /* Hover text color */
        }
        
        #portButton:hover {
            border-radius: 5px 5px 0px 0px; /* Rounded corners for the top */
        }



    </style>
</head>
<body>
    <header>
        <div class="logo">Atude</div>
        <div class="nav-buttons">
            <button id="portButton">Portfolios</button>
            <div class="dropdown" id="PortfoliosDropdown">
                <a href="#">AtlKyr</a>
                <a href="#">Tugi</a>
                <a href="#">Dean</a>
            </div>
            <button onclick="alert('Store Section Coming Soon!')">Store</button>
            <button onclick="alert('Learn More Section Coming Soon!')">Learn More</button>
        </div>
    </header>

    <section class="hero">
        <h1 style="font-family: Verdana, Geneva, Tahoma, sans-serif; font-size: 40px;">Welcome to Atude</h1>
        <p>The trio of modern game development.</p>
        <button class="cta-button" onclick="alert('Contact Us Coming Soon!')">Our Works</button>
    </section>

    <footer>
        <p>&copy; 2025 Atude. All rights reserved.</p>
    </footer>
</body>
</html>
